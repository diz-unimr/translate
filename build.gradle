plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'io.freefair.lombok' version '9.2.0'
}

group = 'de.unimarburg.diz'
version = '0.0.1-SNAPSHOT'
description = 'Webservice to translate feasibility queries to CQL'

java {
    sourceCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven {
        url = uri("https://maven.pkg.github.com/medizininformatik-initiative/cctb")
        name = "GitHub Medizininformatik-Initiative Packages"
        credentials {
            username = project.findProperty("gpr.user") ?: System.getenv("GH_USERNAME")
            password = project.findProperty("gpr.key") ?: System.getenv("GH_TOKEN")
        }
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'de.medizininformatik-initiative:cctb-cql:2.0.0'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.6'

    // test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = false
    }
}

check.dependsOn jacocoTestReport

jar {
    enabled = false
}

bootJar {
    mainClass.set('de.unimarburg.diz.translate.TranslateApplication')
}

